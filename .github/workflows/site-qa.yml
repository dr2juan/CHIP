name: Site QA

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/site-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constellation:
    name: Bilingual constellation QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright for QA
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run bilingual constellation checks
        run: node tools/constellation-qa.js
